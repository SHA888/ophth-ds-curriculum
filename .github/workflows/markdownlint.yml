name: Markdown Lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.qmd"
      - "**/*.Rmd"
  workflow_call:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Run markdownlint
        run: |
          dirs="phases/01-imaging-foundations phases/02-classical-cv phases/03-deep-learning phases/04-domain-projects phases/05-clinical-translation"
          files=""
          for d in $dirs; do
            if [ -d "$d" ]; then
              files="$files $d/**"
            fi
          done
          if [ -n "$files" ]; then
            markdownlint-cli2 $files
          else
            echo "No markdown files to lint"
          fi
