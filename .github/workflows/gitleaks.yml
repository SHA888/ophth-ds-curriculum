name: Secret Scan (gitleaks)

on:
  pull_request:
    paths:
      - "**/*"
  workflow_call:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --report-format json --report-path gitleaks-report.json --redact
