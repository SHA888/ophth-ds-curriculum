name: Quarto Render

on:
  push:
    branches: [main]
    paths:
      - "phases/01-imaging-foundations/**/*.qmd"
      - "phases/02-classical-cv/**/*.qmd"
      - "phases/03-deep-learning/**/*.qmd"
      - "phases/04-domain-projects/**/*.qmd"
      - "phases/05-clinical-translation/**/*.qmd"
      - "_quarto.yml"
  pull_request:
    paths:
      - "phases/01-imaging-foundations/**/*.qmd"
      - "phases/02-classical-cv/**/*.qmd"
      - "phases/03-deep-learning/**/*.qmd"
      - "phases/04-domain-projects/**/*.qmd"
      - "phases/05-clinical-translation/**/*.qmd"
      - "_quarto.yml"
  workflow_call:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.4.550"
      - name: Render site (HTML)
        run: quarto render phases/01-imaging-foundations --to html
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
