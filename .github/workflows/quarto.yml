name: Quarto Render

on:
  push:
    branches: [main]
    paths:
      - "phases/01-*.qmd"
      - "phases/02-*.qmd"
      - "phases/03-*.qmd"
      - "phases/04-*.qmd"
      - "phases/05-*.qmd"
      - "_quarto.yml"
  pull_request:
    paths:
      - "phases/01-*.qmd"
      - "phases/02-*.qmd"
      - "phases/03-*.qmd"
      - "phases/04-*.qmd"
      - "phases/05-*.qmd"
      - "_quarto.yml"
  workflow_call:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.4.550"
      - name: Render site
        run: quarto render phases/01-imaging-foundations --to html
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./_site
