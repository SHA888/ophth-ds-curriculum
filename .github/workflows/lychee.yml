name: Link Check (Lychee)

on:
  schedule:
    - cron: "0 0 * * 0" # weekly
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.qmd"
      - "**/*.Rmd"
  workflow_call:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/v0.15.1/lychee-v0.15.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv lychee /usr/local/bin/lychee
      - name: Run lychee
        run: |
          dirs="phases/01-imaging-foundations phases/02-classical-cv phases/03-deep-learning phases/04-domain-projects phases/05-clinical-translation"
          files=""
          for d in $dirs; do
            if [ -d "$d" ]; then
              files="$files $d/**"
            fi
          done
          lychee $files --verbose --no-progress
